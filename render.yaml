services:
  - type: web
    name: hotel-sikkolu
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/render-start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-sikkolu-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: REPORT_RECIPIENTS
        sync: false

  - type: cron
    name: hotel-sikkolu-daily-report
    runtime: ruby
    schedule: "45 17 * * *"
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails runner 'DailyReportJob.perform_now'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-sikkolu-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: REPORT_RECIPIENTS
        sync: false

databases:
  - name: hotel-sikkolu-db
    plan: free
